name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Build and test
        shell: bash
        run: |
          uvx conan profile detect
          uvx conan create .

          cmake -B build . -DBUILD_TESTS=ON
          cmake --build build && build/strzcpy_tests

  build-windows:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Build and test
        shell: bash
        run: |
          uvx conan profile detect
          uvx conan create .

          cmake -B build . -DBUILD_TESTS=ON
          cmake --build build && build/Debug/strzcpy_tests.exe
